[project]
name = "embodied-gaussians"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Jad Abou-Chakra" }]
description = "Physically Embodied Gaussian Splatting"
version = "0.1.0"
dependencies = [
    "numpy>=1.26,<2",
    "warp-lang @ https://github.com/NVIDIA/warp/releases/download/v1.9.1/warp_lang-1.9.1%2Bcu13-py3-none-manylinux_2_34_x86_64.whl",
    "torch==2.13.0",
    "tyro",
    "torchvision==0.28.0",
    "tqdm",
    "zarr>=3.0.4,<3.1",
    "trio",
    "trio-util",
    "opencv-python",
    "glfw>=2.8.0,<3",
    "open3d==0.19.0",
    "marsoom @ git+https://github.com/davelearn/marsoom.git@46ccb9b769dcc70c38cfb6cdbe58d9cee5c38037",
    "torchcodec==0.15.0",
    "realsense @ git+https://github.com/davelearn/realsense.git@7f030bebaffe5c190cccbca9f578fd50d95a72ec",
    "isegm @ git+https://github.com/jc211/ritm_interactive_segmentation",
    "pydantic",
    "pyrealsense2>=2.54.2,<3",
]

[dependency-groups]
build = ["scikit-build-core>=0.10", "pybind11>=2.10"]
test = ["pytest>=8.3.5,<9"]
lint = ["ruff==0.15.22"]
typecheck = ["basedpyright==1.39.9"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [{ platform = "linux-64", cuda = "13.0", glibc = "2.31" }]

[tool.pixi.pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu130"]

[tool.pixi.dependencies]
ffmpeg = ">=7,<8"
cuda-nvcc = "13.0.*"
cuda-version = "13.0.*"
cmake = "*"
ninja = "*"
pip = ">=25.0.1,<26"

[tool.pixi.pypi-dependencies]
embodied-gaussians = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["build", "test", "lint", "typecheck"], solve-group = "default" }

[tool.pixi.tasks]
build-gsplat = "python scripts/build_gsplat.py"
build = { cmd = "python -c \"import gsplat\"", depends-on = ["build-gsplat"] }
test = "pytest; code=$?; [ $code -eq 0 ] || [ $code -eq 5 ]"
demo = "python examples/example_embodied_pusht_offline.py"
format = "ruff format src scripts examples"
format-check = "ruff format --check src scripts examples"
lint = "ruff check src scripts examples"
typecheck = "basedpyright"
check = { depends-on = ["format-check", "lint", "typecheck", "test"] }

[tool.pixi.activation]
env = { LD_LIBRARY_PATH = "$CONDA_PREFIX/lib:$LD_LIBRARY_PATH" }

[tool.ruff]
line-length = 150
extend-exclude = ["examples/output"]

[tool.ruff.lint]
select = ["E", "F"]

[tool.basedpyright]
include = ["src"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
failOnWarnings = true
reportPrivateImportUsage = false
allowedUntypedLibraries = [
    "gsplat",
    "isegm_gui",
    "marsoom",
    "open3d",
    "realsense",
    "torchcodec",
    "warp",
]
