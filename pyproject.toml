[project]
name = "embodied-gaussians"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Jad Abou-Chakra" }]
description = "Physically Embodied Gaussian Splatting"
version = "0.1.0"
dependencies = [
    "numpy>=1.26,<2",
    "warp-lang==1.7.1",
    "torch>=2.7,<2.8",
    "tyro",
    "torchvision>=0.22,<0.23",
    "tqdm",
    "zarr>=3.0.4,<3.1",
    "trio",
    "trio-util",
    "opencv-python",
    "glfw>=2.8.0,<3",
    "open3d>=0.18.0,<0.19.0",
    "marsoom @ git+https://github.com/jc211/marsoom.git@febe61df91a75df10063bfb420e9e68a9a8cd6a9",
    "torchcodec==0.3.0",
    "realsense @ git+https://github.com/davelearn/realsense.git@b3cc6bae06bfac0f8719ac95a7511815dac1213d",
    "isegm @ git+https://github.com/jc211/ritm_interactive_segmentation",
    "pydantic",
    "pyrealsense2>=2.54.2,<3",
]

[dependency-groups]
build = ["scikit-build-core>=0.10", "pybind11>=2.10"]
test = ["pytest>=8.3.5,<9"]
lint = ["ruff==0.15.22"]
typecheck = ["basedpyright==1.39.9"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [{ platform = "linux-64", cuda = "12.8", glibc = "2.31" }]

[tool.pixi.pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu128"]

[tool.pixi.dependencies]
ffmpeg = ">=7,<8"
cuda = "12.8.*"
cuda-version = "<=12.8"
cmake = "*"
ninja = "*"
pip = ">=25.0.1,<26"

[tool.pixi.pypi-dependencies]
embodied-gaussians = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["build", "test", "lint", "typecheck"], solve-group = "default" }

[tool.pixi.tasks]
build-gsplat = "python scripts/build_gsplat.py"
build = { cmd = "python -c \"import gsplat\"", depends-on = ["build-gsplat"] }
test = "pytest; code=$?; [ $code -eq 0 ] || [ $code -eq 5 ]"
demo = "python examples/example_embodied_pusht_offline.py"
format = "ruff format src scripts examples"
format-check = "ruff format --check src scripts examples"
lint = "ruff check src scripts examples"
typecheck = "basedpyright"
check = { depends-on = ["format-check", "lint", "typecheck", "test"] }

[tool.pixi.activation]
env = { LD_LIBRARY_PATH = "$CONDA_PREFIX/lib:$LD_LIBRARY_PATH" }

[tool.ruff]
line-length = 150
extend-exclude = ["examples/output"]

[tool.ruff.lint]
select = ["E", "F"]

[tool.basedpyright]
include = ["src"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
failOnWarnings = true
allowedUntypedLibraries = [
    "gsplat",
    "isegm_gui",
    "marsoom",
    "open3d",
    "realsense",
    "torchcodec",
    "warp",
]
